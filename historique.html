<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Historique</title>

<style>

body{

    background:#000;

    color:white;

    font-family:Arial,sans-serif;

    padding:30px;
}

h1{

    color:#D4AF37;

    text-align:center;
}

.card{

    max-width:700px;

    margin:30px auto;

    padding:25px;

    border-radius:20px;

    background:#111;
}

.question{

    font-size:24px;

    margin-bottom:25px;

    color:#D4AF37;
}

.answer{

    margin-top:15px;

    padding:15px;

    border-radius:12px;

    background:#1c1c1c;

    border-left:
        3px solid
        rgba(212,175,55,.25);
}

.label{

    color:#D4AF37;

    font-weight:bold;
}

h3{

    color:#D4AF37;

    font-size:18px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:15px;
}

</style>

</head>

<body>

<h1>

📖 Notre livre de souvenirs

</h1>

<div
id="history">

Chargement...

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey:
    "AIzaSyAnqJ7rT7a4SaW4f_48faLgxjIMhKO4kCI",

    authDomain:
    "calendrier-avent-couple-52fba.firebaseapp.com",

    projectId:
    "calendrier-avent-couple-52fba",

    storageBucket:
    "calendrier-avent-couple-52fba.firebasestorage.app",

    messagingSenderId:
    "101261649418",

    appId:
    "1:101261649418:web:7c06721ae0a556fc7de1f3"
};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

async function loadHistory(){

    const querySnapshot =
    await getDocs(
        collection(
            db,
            "reponses"
        )
    );

    let html = "";

querySnapshot.forEach(
    (documento) => {

        const jour =
        documento.id;

        const numeroJour =
        parseInt(
            jour.split("_")[1]
        );

        const dateObjet =
        new Date(
            2026,
            11,
            numeroJour
        );

        const dateTexte =
        dateObjet.toLocaleDateString(
            "fr-FR",
            {
                day:"numeric",
                month:"long"
            }
        );

        const data =
        documento.data();

        if(
            !data.reponse_kelly ||
            !data.reponse_philippe
        ){
            return;
        }

        let badge =
        "🤍 Cœur";

        if(
            data.type ===
            "hot"
        ){
            badge =
            "❤️ Hot";
        }

        if(
            data.type ===
            "ouch"
        ){
            badge =
            "🖤 Mission";
        }
html +=
`
<div class="card">

    <h3>

    Jour ${numeroJour}
    •
    ${dateTexte}

</h3>

    <div class="label">
        ${badge}
    </div>

    <div class="question">
        ${data.question}
    </div>

    <div class="answer">

        <div class="label">
            Kelly
        </div>

        ${data.reponse_kelly || ""}

    </div>

    <div class="answer">

        <div class="label">
            Philippe
        </div>

        ${data.reponse_philippe || ""}

    </div>

</div>
`;

        }
    );

    document
    .getElementById(
        "history"
    )
    .innerHTML =
    html;
}

loadHistory();

</script>

</body>

</html>
